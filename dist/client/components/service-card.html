<template id="service-card-template">
  <article class="service-card reveal-up">
    <div class="service-icon"><i data-lucide="{{icon}}" aria-hidden="true"></i></div>
    <span class="service-number">{{number}}</span>
    <h3>{{title}}</h3>
    <p>{{description}}</p>
    <ul>{{items}}</ul>
    <a href="contact.html?service={{slug}}" class="text-link">Discuss this service <i data-lucide="arrow-right" aria-hidden="true"></i></a>
  </article>
</template>
