<template id="project-card-template">
  <article class="project-card reveal-up" data-category="{{category}}" data-search="{{search}}">
    <a class="project-visual" href="{{caseStudyUrl}}" aria-label="Read {{title}} case study">
      <img src="{{image}}" alt="{{imageAlt}}" width="960" height="640" loading="lazy" decoding="async">
      <span class="project-index">{{index}}</span>
      <span class="project-open"><i data-lucide="arrow-up-right" aria-hidden="true"></i></span>
      <div class="project-browser-chrome" aria-hidden="true"><span></span><span></span><span></span><small>{{host}}</small></div>
    </a>
    <div class="project-card-body">
      <div class="project-card-top"><span class="project-category">{{categoryLabel}}</span><span>{{year}}</span></div>
      <h3><a href="{{caseStudyUrl}}">{{title}}</a></h3>
      <p>{{description}}</p>
      <ul class="tag-list" aria-label="Technologies">{{tags}}</ul>
      <div class="project-links">{{links}}</div>
    </div>
  </article>
</template>
