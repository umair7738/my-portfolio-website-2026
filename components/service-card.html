<template id="service-card-template">
  <article class="service-card reveal-up" data-service-slug="{{slug}}">
    <div class="service-icon"><i data-lucide="{{icon}}" aria-hidden="true"></i></div>
    <span class="service-number">{{number}}</span>
    <h3 data-i18n-text="0:service.{{slug}}.title">{{title}}</h3>
    <p data-i18n-text="0:service.{{slug}}.description">{{description}}</p>
    <ul>{{items}}</ul>
    <a href="contact.html?service={{slug}}" class="text-link" data-analytics-event="service_cta_click" data-analytics-service="{{slug}}" data-analytics-location="service_card" data-i18n-text="0:ui.service.discuss">Discuss this service <i data-lucide="arrow-right" aria-hidden="true"></i></a>
  </article>
</template>
