<form class="contact-form" id="contactForm" novalidate aria-label="Project enquiry form" data-i18n-attrs="aria-label:components.contact-form.attr.0001">
  <div class="form-status" role="status" aria-live="polite"></div>
  <div class="row g-4">
    <div class="col-md-6">
      <label for="name" data-i18n-text="0:components.contact-form.text.0001">Your name</label>
      <input class="form-control" type="text" id="name" name="name" autocomplete="name" required minlength="2" placeholder="Jane Smith" data-i18n-attrs="placeholder:components.contact-form.attr.0002">
      <span class="field-error" data-i18n-text="0:components.contact-form.text.0002">Please enter your name.</span>
    </div>
    <div class="col-md-6">
      <label for="email" data-i18n-text="0:components.contact-form.text.0003">Work email</label>
      <input class="form-control" type="email" id="email" name="email" autocomplete="email" required placeholder="jane@company.com" data-i18n-attrs="placeholder:components.contact-form.attr.0003">
      <span class="field-error" data-i18n-text="0:components.contact-form.text.0004">Please enter a valid email.</span>
    </div>
    <div class="col-md-6">
      <label for="company" data-i18n-text="0:components.contact-form.text.0005">Company <span data-i18n-text="0:components.contact-form.text.0006">(optional)</span></label>
      <input class="form-control" type="text" id="company" name="company" autocomplete="organization" placeholder="Company or studio" data-i18n-attrs="placeholder:components.contact-form.attr.0004">
    </div>
    <div class="col-md-6">
      <label for="projectType" data-i18n-text="0:components.contact-form.text.0007">What can I help with?</label>
      <select class="form-select" id="projectType" name="projectType" required>
        <option value="" selected disabled data-i18n-text="0:components.contact-form.text.0008">Select a service</option>
        <option value="Employment / Job Opportunity" data-service-slug="employment" data-i18n-text="0:components.contact-form.text.0024">Employment / Job Opportunity (Recruiter)</option>
        <option value="Frontend development" data-service-slug="frontend-development" data-i18n-text="0:components.contact-form.text.0009">Frontend development</option><option value="Business website" data-service-slug="business-websites" data-i18n-text="0:components.contact-form.text.0010">Business website</option><option value="Landing page" data-service-slug="landing-pages" data-i18n-text="0:components.contact-form.text.0011">Landing page</option><option value="WordPress development" data-service-slug="wordpress-development" data-i18n-text="0:components.contact-form.text.0012">WordPress development</option><option value="Laravel / PHP development" data-service-slug="laravel-development" data-i18n-text="0:components.contact-form.text.0013">Laravel / PHP development</option><option value="PHP Development" data-service-slug="php-development" data-i18n-text="0:components.contact-form.text.0025">PHP Development</option><option value="Custom Theme Development" data-service-slug="custom-theme-development" data-i18n-text="0:components.contact-form.text.0026">Custom Theme Development</option><option value="Custom Plugin Development" data-service-slug="custom-plugin-development" data-i18n-text="0:components.contact-form.text.0027">Custom Plugin Development</option><option value="CRM Systems" data-service-slug="crm-systems" data-i18n-text="0:components.contact-form.text.0028">CRM Systems</option><option value="HRMS Interfaces" data-service-slug="hrms-interfaces" data-i18n-text="0:components.contact-form.text.0029">HRMS Interfaces</option><option value="Property Management" data-service-slug="property-management" data-i18n-text="0:components.contact-form.text.0030">Property Management</option><option value="API Integration" data-service-slug="api-integration" data-i18n-text="0:components.contact-form.text.0031">API Integration</option><option value="Payment Gateway Integration" data-service-slug="payment-gateway-integration" data-i18n-text="0:components.contact-form.text.0032">Payment Gateway Integration</option><option value="Performance & SEO" data-service-slug="speed-optimization" data-i18n-text="0:components.contact-form.text.0014">Performance & SEO</option><option value="SEO Optimization" data-service-slug="seo-optimization" data-i18n-text="0:components.contact-form.text.0033">SEO Optimization</option><option value="GSAP Animated Websites" data-service-slug="gsap-animated-websites" data-i18n-text="0:components.contact-form.text.0034">GSAP Animated Websites</option><option value="Website redesign" data-service-slug="website-redesign" data-i18n-text="0:components.contact-form.text.0015">Website redesign</option><option value="Maintenance / bug fixing" data-service-slug="website-maintenance" data-i18n-text="0:components.contact-form.text.0016">Maintenance / bug fixing</option><option value="Bug Fixing" data-service-slug="bug-fixing" data-i18n-text="0:components.contact-form.text.0035">Bug Fixing</option><option value="Other" data-service-slug="other" data-i18n-text="0:components.contact-form.text.0017">Other</option>
      </select>
      <span class="field-error" data-i18n-text="0:components.contact-form.text.0018">Please choose a service.</span>
    </div>
    <div class="col-12">
      <label for="message" data-i18n-text="0:components.contact-form.text.0019">Tell me about the goal</label>
      <textarea class="form-control" id="message" name="message" rows="5" required minlength="20" placeholder="What are you building, who is it for, and what does success look like?" data-i18n-attrs="placeholder:components.contact-form.attr.0005"></textarea>
      <span class="field-error" data-i18n-text="0:components.contact-form.text.0020">Please add at least 20 characters.</span>
    </div>
    <div class="col-12 form-consent">
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent" data-i18n-text="0:components.contact-form.text.0021">I agree to be contacted about this enquiry. See the <a href="privacy.html" data-i18n-text="0:components.contact-form.text.0022">privacy policy</a>.</label>
    </div>
    <div class="col-12">
      <button class="btn btn-primary btn-lg magnetic" type="submit" data-i18n-text="0:components.contact-form.text.0023">Send enquiry <i data-lucide="send" aria-hidden="true"></i></button>
    </div>
  </div>
</form>
