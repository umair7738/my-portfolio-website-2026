<form class="contact-form" id="contactForm" novalidate aria-label="Project enquiry form">
  <div class="form-status" role="status" aria-live="polite"></div>
  <div class="row g-4">
    <div class="col-md-6">
      <label for="name">Your name</label>
      <input class="form-control" type="text" id="name" name="name" autocomplete="name" required minlength="2" placeholder="Jane Smith">
      <span class="field-error">Please enter your name.</span>
    </div>
    <div class="col-md-6">
      <label for="email">Work email</label>
      <input class="form-control" type="email" id="email" name="email" autocomplete="email" required placeholder="jane@company.com">
      <span class="field-error">Please enter a valid email.</span>
    </div>
    <div class="col-md-6">
      <label for="company">Company <span>(optional)</span></label>
      <input class="form-control" type="text" id="company" name="company" autocomplete="organization" placeholder="Company or studio">
    </div>
    <div class="col-md-6">
      <label for="projectType">What can I help with?</label>
      <select class="form-select" id="projectType" name="projectType" required>
        <option value="" selected disabled>Select a service</option>
        <option>Frontend development</option><option>Business website</option><option>Landing page</option><option>WordPress development</option><option>Laravel / PHP development</option><option>Performance & SEO</option><option>Website redesign</option><option>Maintenance / bug fixing</option><option>Other</option>
      </select>
      <span class="field-error">Please choose a service.</span>
    </div>
    <div class="col-12">
      <label for="message">Tell me about the goal</label>
      <textarea class="form-control" id="message" name="message" rows="5" required minlength="20" placeholder="What are you building, who is it for, and what does success look like?"></textarea>
      <span class="field-error">Please add at least 20 characters.</span>
    </div>
    <div class="col-12 form-consent">
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent">I agree to be contacted about this enquiry. See the <a href="privacy.html">privacy policy</a>.</label>
    </div>
    <div class="col-12">
      <button class="btn btn-primary btn-lg magnetic" type="submit">Send enquiry <i data-lucide="send" aria-hidden="true"></i></button>
      <p class="form-note"><i data-lucide="lock-keyhole" aria-hidden="true"></i> This demo opens your email app. Connect a secure form endpoint before launch.</p>
    </div>
  </div>
</form>
