<div class="page-loader" role="status" aria-live="polite" aria-label="Preparing Umair Shaikh's portfolio">
  <div class="loader-panel loader-panel-top" aria-hidden="true"></div>
  <div class="loader-panel loader-panel-bottom" aria-hidden="true"></div>
  <div class="loader-grid" aria-hidden="true"></div>
  <div class="loader-scan" aria-hidden="true"></div>

  <div class="loader-stage">
    <div class="loader-topline">
      <span class="loader-monogram" aria-hidden="true">US<span></span></span>
      <span class="loader-coordinate">19.0760° N&nbsp;&nbsp;·&nbsp;&nbsp;72.8777° E</span>
    </div>

    <div class="loader-title" aria-hidden="true">
      <span class="loader-letter-wrap"><span class="loader-letter">U</span></span>
      <span class="loader-letter-wrap"><span class="loader-letter">M</span></span>
      <span class="loader-letter-wrap"><span class="loader-letter">A</span></span>
      <span class="loader-letter-wrap"><span class="loader-letter">I</span></span>
      <span class="loader-letter-wrap"><span class="loader-letter">R</span></span>
    </div>

    <div class="loader-console">
      <div class="loader-status">
        <span class="loader-status-dot" aria-hidden="true"></span>
        <span data-loader-status>Loading interface</span>
      </div>
      <span class="loader-count" data-loader-percent>000</span>
    </div>
    <div class="loader-progress" aria-hidden="true"><span></span></div>
    <div class="loader-meta">
      <span>Full Stack Development</span>
      <span>Motion · Performance · Detail</span>
    </div>
  </div>
</div>
<script>
  (function () {
    if (!window.matchMedia("(max-width: 767.98px), (hover: none), (pointer: coarse)").matches) return;
    window.__portfolioMobileIntroDeadline = performance.now() + 1000;
    window.__finishPortfolioMobileIntro = function () {
      const loader = document.querySelector(".page-loader");
      if (loader) loader.remove();
      document.body.classList.remove("loading", "is-revealing");
    };
    window.setTimeout(function () { document.body.classList.add("is-revealing"); }, 760);
    window.setTimeout(window.__finishPortfolioMobileIntro, 1000);
  })();
</script>
